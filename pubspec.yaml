name: vex_owl_app
description: "vex owl - 本地实时 AI 对话应用"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'

# Application version & build number
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.0

  # 路由
  go_router: ^14.6.2

  # 文件与路径
  path_provider: ^2.1.4
  path: ^1.9.0

  # 时间格式化
  intl: ^0.19.0

  # 数据库(Drift)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24

  # LangChain(请求大模型与工具调用)
  langchain: ^0.8.1
  langchain_openai: ^0.8.1

  # HTTP 客户端(博查搜索 / 后续第三方 API 调用)
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/logo/