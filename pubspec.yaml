name: Owl
description: "Owl - 本地实时 AI 对话应用"
publish_to: 'none'

version: 0.2.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # 状态管理
  flutter_riverpod: ^2.6.1

  # 路由
  go_router: ^14.8.1

  # 文件与路径
  path_provider: ^2.1.6
  path: ^1.9.1

  # 时间格式化
  intl: ^0.19.0

  # HTTP 客户端
  http: ^1.6.0

  # 文件选择
  file_picker: ^8.0.0
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  mocktail: ^1.0.5

# 自 v3.0 起：所有结构化数据通过 Markdown 文件持久化到 wiki/ 目录，
# SQLite / Drift 已全部移除。

flutter:
  uses-material-design: true

  assets:
    - assets/logo/